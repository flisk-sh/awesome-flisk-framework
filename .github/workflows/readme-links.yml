name: README links

on:
  pull_request:
    paths:
      - README.md
      - .github/workflows/readme-links.yml
  schedule:
    - cron: '18 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Hosts that block crawlers and temporary server failures are non-blocking.
          args: >-
            --verbose --no-progress --scheme https --scheme http --exclude-all-private
            --max-concurrency 6 --max-retries 1 --timeout 12
            --accept '200..=299,403,429,500,502,503,504' README.md
          token: ''
